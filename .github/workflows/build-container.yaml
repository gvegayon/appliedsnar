name: Build and Push Container Image

# Builds the rendering image from .devcontainer/Containerfile and publishes
# it to GHCR, replacing the old manual `make push` to Docker Hub. This also
# keeps TinyTeX from going stale: a rendering image built once and reused
# for months drifts out of sync with the current CTAN/TeX Live repository,
# which is what caused the "amssymb.sty not found" failures in build-pdf
# and build-pdf-es (see PR #14). The monthly schedule rebuilds the image
# with a fresh TinyTeX install so that drift can't reaccumulate.

on:
  push:
    branches: [master, main]
    paths:
      - '.devcontainer/Containerfile'
      - '.github/workflows/build-container.yaml'
  schedule:
    - cron: '17 6 1 * *'
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push
      uses: docker/build-push-action@v6
      with:
        context: .
        file: .devcontainer/Containerfile
        push: true
        tags: |
          ghcr.io/${{ github.repository }}:latest
          ghcr.io/${{ github.repository }}:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
